name: 'Migration Detector'
author: 'iclinic'
description: >
  Detecta arquivos de migração de banco de dados em PRs, classifica o impacto com um
  classificador determinístico e notifica o time de dados em um canal do Slack.

inputs:
  github_token:
    required: true
    description: >
      DEPRECADO na prática — a action não lê mais este token. Ele era a credencial da
      GitHub Models API; a classificação passou a ser determinística e não chama API
      nenhuma, e os metadados do PR vêm do contexto `github.event.pull_request`, que não
      precisa de token. A permissão `models: read` deixou de ser necessária no workflow.
      Continua declarado e obrigatório por uma versão para não quebrar os consumidores
      que já o passam; tornar-se opcional fica para a remoção dos inputs de IA.
  ai_api_url:
    required: false
    default: ''
    description: >
      DEPRECADO — inerte desde a classificação determinística. A action não chama mais
      API de IA. O input continua declarado por uma versão para não quebrar quem já o
      passa; nenhum valor tem efeito. Pode ser removido do workflow.
  ai_api_key:
    required: false
    default: ''
    description: >
      DEPRECADO — inerte desde a classificação determinística. A action não chama mais
      API de IA, então não há chave a fornecer. O input continua declarado por uma versão
      para não quebrar quem já o passa. Pode ser removido do workflow.
  ai_model:
    required: false
    default: ''
    description: >
      DEPRECADO — inerte desde a classificação determinística. Não há modelo a escolher.
      O input continua declarado por uma versão para não quebrar quem já o passa.
      Pode ser removido do workflow.
  migration_paths:
    required: false
    default: '**/*.sql,**/migrations/*.py,**/alembic/versions/*.py,**/*AutoMigrate.ts,**/*automigrate.ts,**/migrations/*.ts,**/Migrations/*/Version20*.php'
    description: >
      Globs separados por vírgula para identificar arquivos de migração. Cobre:
      SQL puro, Django (migrations/*.py), Alembic/FastAPI (alembic/versions/*.py),
      TypeScript com AutoMigrate ou escrito à mão em migrations/*.ts, e Doctrine
      Migrations em PHP (Migrations/<banco>/Version*.php).

      O `*` do meio do glob do Doctrine é o **diretório do banco**, e é ele que
      faz o consumidor de duas bases entrar inteiro: o `migrations_path` de cada
      conexão do `Migrations/migrations.php` é um diretório diferente — um MySQL,
      que guarda o financeiro do SaaS, e um PostgreSQL, que guarda o resto do
      sistema —, e um glob que nomeasse os dois diretórios deixaria uma terceira
      base futura fora do alerta sem que nada falhasse. Um banco fora do glob é
      um banco sem proteção, e é o silêncio que esta action existe para acabar.

      O `20` depois de `Version` não é decoração. O runner do consumidor mora em
      `Migrations/Migrator/`, e o `VersionHelper.php` de lá casaria
      `Migrations/*/Version*.php` — entraria na coleta a cada mexida no runner e
      sairia como `unknown`, porque não é migração. O nome do arquivo de uma
      migração do Doctrine é `VersionAAAAMMDDHHMMSS`, então o prefixo do ano
      separa os dois. Recortar isso com `Version[0-9]*` seria mais claro, mas a
      conversão glob→regex do step `Collect` só entende `*`, `**` e ponto
      literal, e classe de caractere é erro de configuração ali por decisão.
  ignore_name_contains:
    required: false
    default: 'dump'
    description: >
      Termos (separados por vírgula, case-insensitive) presentes no nome do arquivo
      que indicam que ele deve ser ignorado. Padrão: `dump` (arquivos de dump local).
  slack_webhook_url:
    required: true
    description: >
      Webhook do Slack para envio da notificação de impacto ao canal do time de dados.
  slack_channel:
    required: false
    default: ''
    description: >
      Nome lógico do canal Slack (ex.: #data-impact-alerts). Usado para log e, quando
      compatível com a configuração do webhook, para roteamento da mensagem.
  minimum_confidence:
    required: false
    default: '0.70'
    description: >
      DEPRECADO — inerte desde a classificação determinística. O input continua declarado
      para não quebrar quem já o passa, mas nenhum valor tem efeito: não existe mais
      promoção de `safe` para `controlled` por limiar. Uma operação que o classificador
      não reconhece agora sai como `unknown`, com emoji e texto próprios no Slack.
      Pode ser removido do workflow.

outputs:
  has_db_change:
    description: '`true` se ao menos um arquivo de migração com mudança de banco for detectado.'
    value: ${{ steps.set-outputs.outputs.has_db_change }}
  highest_severity:
    description: >
      Severidade máxima encontrada: `none`, `safe`, `controlled`, `unknown` ou `breaking`,
      nessa ordem de gravidade. `unknown` significa que o classificador não entendeu ao
      menos uma operação do PR — é um pedido de revisão manual, não uma classificação
      benigna.
    value: ${{ steps.set-outputs.outputs.highest_severity }}
  confidence:
    description: >
      DEPRECADO — mantido apenas para quem já lê o output. Num classificador
      determinístico não há gradação: `0.0` quando `highest_severity` é `unknown`,
      `1.0` em qualquer outro caso. Use `highest_severity == 'unknown'`.
    value: ${{ steps.set-outputs.outputs.confidence }}
  slack_message_ts:
    description: 'Timestamp da mensagem postada no Slack (disponível apenas com Incoming Webhooks v2+).'
    value: ${{ steps.slack.outputs.slack_message_ts }}

runs:
  using: composite
  steps:

    # -------------------------------------------------------------------------
    # 0. Avisa quem ainda passa input de IA
    #
    # Os quatro inputs continuam declarados por uma versão para não quebrar
    # consumidor fora dos três conhecidos. Passar um deles não muda nada e não
    # derruba nada: só imprime um aviso, para que a remoção na próxima versão
    # não pegue ninguém de surpresa. Sem `if`, porque quem precisa do aviso é
    # quem configurou o workflow, e isso independe de o PR ter migração.
    # -------------------------------------------------------------------------
    - name: Setup | Warn on deprecated inputs
      shell: bash
      env:
        AI_API_URL: ${{ inputs.ai_api_url }}
        AI_API_KEY: ${{ inputs.ai_api_key }}
        AI_MODEL: ${{ inputs.ai_model }}
        MINIMUM_CONFIDENCE: ${{ inputs.minimum_confidence }}
      run: |
        set -euo pipefail
        warn() {
          echo "::warning::Input \`$1\` está DEPRECADO e não tem efeito: a classificação é determinística e a action não chama API de IA. Remova-o do workflow."
        }
        [[ -n "$AI_API_URL" ]] && warn ai_api_url
        [[ -n "$AI_API_KEY" ]] && warn ai_api_key
        [[ -n "$AI_MODEL"   ]] && warn ai_model
        [[ "$MINIMUM_CONFIDENCE" != "0.70" ]] && warn minimum_confidence
        # `[[ ... ]] &&` com o teste falso devolve 1, e o último da lista
        # decidiria o exit code do step inteiro sob `set -e`. Um aviso de
        # depreciação não pode derrubar o job de ninguém.
        exit 0

    # -------------------------------------------------------------------------
    # 1. Coleta os arquivos de migração alterados no PR
    # -------------------------------------------------------------------------
    - name: Collect | Find changed migration files
      id: collect
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        MIGRATION_PATHS: ${{ inputs.migration_paths }}
        IGNORE_TERMS: ${{ inputs.ignore_name_contains }}
        HAS_SLACK_WEBHOOK: ${{ inputs.slack_webhook_url != '' }}
      run: |
        set -euo pipefail

        # Arquivo do diff com cara de migração: sob `migrations/` ou
        # `alembic/versions/`, ou com nome prefixado por timestamp. É a regra
        # que a ADR 0001 põe na lista do que não é negociável, e ela fecha a
        # classe que o `**/migrations/*.ts` do default fecha só para um caso.
        # A extensão entra na regex para não transformar `assets/20240101_logo.png`
        # em suspeita de migração. A terceira forma é a do Doctrine:
        # `Migrations/<banco>/Version<timestamp>.php` não cai em nenhuma das
        # outras duas, e os dígitos depois de `Version` deixam o
        # `VersionHelper.php` do runner de fora.
        SUSPECT_REGEX='(^|/)(migrations|alembic/versions)/[^/]*\.(py|ts|js|rb|sql|php)$|(^|/)[0-9]{8,}[-_][^/]*\.(py|ts|js|rb|sql|php)$|(^|/)Migrations/[^/]+/Version[0-9]{8,}\.php$'

        # Toda saída do step passa por aqui. A guarda do webhook depende de o PR
        # ter migração ou não, e uma saída que a pulasse publicaria `has_files`
        # sem ter checado para onde avisar.
        finish() {
          local matched="$1" unmatched="$2"

          # Sem webhook a action não tem para onde avisar. Reprovar o PR aqui é
          # o remédio certo quando há migração — sair 0 é o mesmo silêncio que
          # fez a falha da API de IA rodar quatro semanas. Mas a guarda ficava
          # antes do `git diff`, e um repositório sem a variable configurada
          # tinha *todo* PR vermelho, inclusive o de um `README.md`. A ADR
          # autorizou `::warning::` neste caminho, não reprovar quem não toca
          # em banco.
          if [[ "$HAS_SLACK_WEBHOOK" != "true" ]]; then
            if [[ -n "$matched" || -n "$unmatched" ]]; then
              echo "::error::slack_webhook_url não configurada e este PR tem migração. A action não classifica sem ter para onde notificar."
              exit 1
            fi
            echo "::warning::slack_webhook_url não configurada. Enquanto ela faltar, migração neste repositório passa sem aviso."
          fi

          if [[ -n "$unmatched" ]]; then
            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              echo "::warning::$file tem cara de migração e não casou nenhum padrão de \`migration_paths\`. O classificador não o leu."
            done <<< "$unmatched"
            echo "unmatched_files=$(echo "$unmatched" | tr '\n' '|' | sed 's/|$//')" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "$matched" ]]; then
            echo "==> Arquivos de migração candidatos:"
            echo "$matched"
            echo "migration_files=$(echo "$matched" | tr '\n' '|' | sed 's/|$//')" >> "$GITHUB_OUTPUT"
            echo "has_files=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_files=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0
        }

        echo "==> Coletando arquivos alterados entre $BASE_SHA e $HEAD_SHA"

        # `--diff-filter=d` tira do diff o arquivo que o PR removeu. Ele existe
        # no nome e não existe no disco: o classificador tentava abri-lo, o step
        # morria de `FileNotFoundError` — de propósito, porque o `except` genérico
        # saiu desta entrega — e o step do Slack nem chegava a rodar, porque step
        # seguinte não roda depois de step falho. Um PR que reverte migração
        # ficava vermelho e o time de dados não recebia nada. Remover o arquivo
        # de migração do repositório não desfaz o que já rodou no banco, então
        # não é mudança de schema a classificar.
        if ! CHANGED=$(git diff --name-only --diff-filter=d "$BASE_SHA" "$HEAD_SHA"); then
          echo "::error::Não foi possível calcular diff entre BASE_SHA e HEAD_SHA"
          exit 1
        fi

        if [[ -z "$CHANGED" ]]; then
          echo "Nenhum arquivo alterado encontrado."
          finish "" ""
        fi

        echo "==> Todos os arquivos alterados no PR:"
        echo "$CHANGED"

        # Monta regex de inclusão a partir dos globs separados por vírgula
        INCLUDE_REGEX=""

        echo "MIGRATION_PATHS: $MIGRATION_PATHS"

        IFS=',' read -ra PATTERNS <<< "$MIGRATION_PATHS"
        for pattern in "${PATTERNS[@]}"; do
          # Ordem importa:
          #   1. Escapa pontos literais primeiro  (. -> \.)
          #   2. Protege ** com placeholder       (** -> DSTAR)
          #   3. Converte * simples               (* -> [^/]*)
          #   4. Restaura placeholder como .*     (DSTAR -> .*)
          # Sem placeholder, o passo 3 corromperia o .* gerado no passo 2.
          #
          # A conversão só entende `*`, `**` e ponto literal. `?`, `[]` e `{}`
          # passavam por ela e viravam outra regex — `**/migrations/[0-9*.py`
          # vira `.*/migrations/[0-9[^/]*\.py`, que é ERE **válida** e não casa
          # nada. O step publicava has_files=false e o job terminava verde
          # dizendo "sem alteração de banco" num PR que dropou coluna. Como
          # "não casou nada" é indistinguível de "o PR não tem migração", o
          # portão tem que ser na entrada: metacaractere não suportado é erro
          # de configuração e falha alto.
          if [[ "$pattern" == *[][{}?]* ]]; then
            echo "::error::migration_paths contém metacaractere não suportado (?, [], {}) no glob: $pattern"
            echo "::error::A conversão glob→regex só entende '*', '**' e ponto literal."
            exit 1
          fi
          regex=$(echo "$pattern" \
            | sed 's|\.|\\.|g' \
            | sed 's|\*\*|DSTAR|g' \
            | sed 's|\*|[^/]*|g' \
            | sed 's|DSTAR|.*|g')
          # Permite também match sem diretório (arquivo na raiz ou prefixo parcial)
          regex_root=$(echo "$regex" | sed 's|^\.\*/||')
          INCLUDE_REGEX="${INCLUDE_REGEX}${regex}|${regex_root}|"
        done
        INCLUDE_REGEX="${INCLUDE_REGEX%|}"
        echo "==> INCLUDE_REGEX: $INCLUDE_REGEX"

        # `|| true` aqui confundia "nenhum arquivo bateu" (grep sai 1) com
        # "a regex é inválida" (grep sai 2+). Com a conversão glob→regex logo
        # acima, que este arquivo já admite ser frágil, um `migration_paths`
        # malformado fazia o grep abortar, o step publicar has_files=false e o
        # job terminar verde dizendo "sem alteração de banco" num PR que
        # dropou coluna.
        GREP_RC=0
        FILTERED=$(echo "$CHANGED" | grep -E "$INCLUDE_REGEX") || GREP_RC=$?
        if (( GREP_RC > 1 )); then
          echo "::error::Filtro de inclusão inválido gerado a partir de migration_paths: $INCLUDE_REGEX"
          exit 1
        fi

        # O que tem cara de migração e nenhum glob pegou. Calculado sobre
        # `FILTERED`, e não sobre `FINAL`: arquivo que o termo de exclusão
        # comeu casou um glob, e sai avisado logo abaixo por outro caminho.
        #
        # `grep -v '^$'` na lista de padrões não é enfeite: linha vazia é padrão
        # que casa tudo, e sem ele um `FILTERED` vazio zeraria a lista de
        # suspeitos justamente no caso em que ela importa.
        SUSPECT=$(echo "$CHANGED" | grep -E "$SUSPECT_REGEX" || true)
        UNMATCHED=$(
          echo "$SUSPECT" \
            | grep -v '^$' \
            | grep -vxF -f <(printf '%s\n' "$FILTERED" | grep -v '^$') \
            || true
        )

        if [[ -z "$FILTERED" ]]; then
          echo "Nenhum arquivo de migração encontrado após filtro de inclusão."
          finish "" "$UNMATCHED"
        fi

        # Remove arquivos cujo nome contenha os termos de exclusão (ex.: dump)
        FINAL="$FILTERED"
        if [[ -n "$IGNORE_TERMS" ]]; then
          IFS=',' read -ra IGNORE_LIST <<< "$IGNORE_TERMS"
          for term in "${IGNORE_LIST[@]}"; do
            term=$(echo "$term" | xargs)
            # Termo vazio — de `dump, ` ou `,dump` — vira `grep -Fiv ""`, que
            # casa toda linha e descarta a lista inteira. Uma vírgula sobrando
            # no workflow desligava a action em silêncio.
            if [[ -z "$term" ]]; then
              continue
            fi
            FINAL=$(echo "$FINAL" | grep -Fiv "$term" || true)
          done
        fi

        FINAL=$(echo "$FINAL" | grep -v "^$" | sort -u || true)

        # O termo de exclusão existe para dump local, e casa por substring do
        # nome inteiro. Um `ignore_name_contains` mal escolhido come migração de
        # verdade e some com ela sem deixar rastro — o mesmo silêncio do
        # glob-miss, por outra porta. Aqui ele deixa rastro.
        IGNORED=$(
          echo "$FILTERED" \
            | grep -v '^$' \
            | grep -vxF -f <(printf '%s\n' "$FINAL" | grep -v '^$') \
            || true
        )
        if [[ -n "$IGNORED" ]]; then
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            echo "::warning::$file casou \`migration_paths\` e foi descartado por \`ignore_name_contains\`. O classificador não o leu."
          done <<< "$IGNORED"
        fi

        if [[ -z "$FINAL" ]]; then
          echo "Todos os arquivos encontrados foram ignorados (ex.: dump)."
          finish "" "$UNMATCHED"
        fi

        finish "$FINAL" "$UNMATCHED"

    # -------------------------------------------------------------------------
    # 2. Prepara ambiente Python
    # -------------------------------------------------------------------------
    - name: Setup | Python
      if: steps.collect.outputs.has_files == 'true' || steps.collect.outputs.unmatched_files != ''
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Não há `pip install`. O classificador de `detect/` é só biblioteca padrão,
    # então o step de análise não tem dependência de rede — que era, além de
    # lentidão, mais um jeito de o job falhar por motivo alheio à migração. Os
    # steps de hash do requirements e de cache do pip existiam só para servir
    # esse install e saíram junto. O `setup-python` fica: o classificador é
    # Python.

    # -------------------------------------------------------------------------
    # 3. Classifica as migrações e gera o texto para o Slack
    #
    # Determinístico: lê a fonte de cada migração com `ast` e tabelas de
    # severidade. Sem provedor de IA, sem chave, sem rede. Uma operação que o
    # classificador não reconhece sai como `unknown` — um pedido de revisão
    # manual — e nunca como uma classificação benigna.
    # -------------------------------------------------------------------------
    - name: Analyze | Classify migrations
      id: analyze
      if: steps.collect.outputs.has_files == 'true' || steps.collect.outputs.unmatched_files != ''
      shell: bash
      env:
        MIGRATION_FILES: ${{ steps.collect.outputs.migration_files }}
        UNMATCHED_FILES: ${{ steps.collect.outputs.unmatched_files }}
        PR_URL: ${{ github.event.pull_request.html_url }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      run: |
        set -euo pipefail
        python "$GITHUB_ACTION_PATH/classify.py"

    # -------------------------------------------------------------------------
    # 4. Define outputs para o caminho sem arquivos de migração
    # -------------------------------------------------------------------------
    - name: Outputs | No migration files found
      id: no-change
      if: steps.collect.outputs.has_files != 'true' && steps.collect.outputs.unmatched_files == ''
      shell: bash
      run: |
        set -euo pipefail
        echo "has_db_change=false"   >> "$GITHUB_OUTPUT"
        echo "highest_severity=none" >> "$GITHUB_OUTPUT"
        echo "confidence=1.0"        >> "$GITHUB_OUTPUT"
        echo "slack_text="           >> "$GITHUB_OUTPUT"

    # -------------------------------------------------------------------------
    # 5. Consolida outputs em um único step referenciado pelos outputs da action
    # -------------------------------------------------------------------------
    - name: Outputs | Consolidate
      id: set-outputs
      shell: bash
      env:
        HAS_DB_CHANGE:    ${{ steps.analyze.outputs.has_db_change || steps.no-change.outputs.has_db_change }}
        HIGHEST_SEVERITY: ${{ steps.analyze.outputs.highest_severity || steps.no-change.outputs.highest_severity }}
        CONFIDENCE:       ${{ steps.analyze.outputs.confidence || steps.no-change.outputs.confidence }}
      run: |
        set -euo pipefail

        # Último portão. Chegar aqui sem severidade significa que nenhum step
        # classificou, e o default `none` que ficava neste lugar transformava
        # isso num job verde dizendo "sem alteração de banco".
        if [[ -z "${HIGHEST_SEVERITY:-}" || -z "${HAS_DB_CHANGE:-}" || -z "${CONFIDENCE:-}" ]]; then
          echo "::error::Nenhum step definiu a classificação. O job não termina sem ela."
          exit 1
        fi

        echo "has_db_change=${HAS_DB_CHANGE}"       >> "$GITHUB_OUTPUT"
        echo "highest_severity=${HIGHEST_SEVERITY}" >> "$GITHUB_OUTPUT"
        echo "confidence=${CONFIDENCE}"             >> "$GITHUB_OUTPUT"

    # -------------------------------------------------------------------------
    # 6. Posta notificação no Slack
    # -------------------------------------------------------------------------
    - name: Notify | Post to Slack
      id: slack
      if: steps.collect.outputs.has_files == 'true' || steps.collect.outputs.unmatched_files != ''
      shell: bash
      env:
        SLACK_WEBHOOK_URL: ${{ inputs.slack_webhook_url }}
        SLACK_CHANNEL:     ${{ inputs.slack_channel }}
        SLACK_TEXT:        ${{ steps.analyze.outputs.slack_text }}
        HIGHEST_SEVERITY:  ${{ steps.analyze.outputs.highest_severity }}
      run: |
        set -euo pipefail
        # Usa Python para montar o JSON corretamente e evitar problemas de escaping
        echo "{}" > /tmp/slack_resp.json

        HTTP_STATUS=$(python3 "$GITHUB_ACTION_PATH/build_slack_payload.py" \
          | curl -s \
            -o /tmp/slack_resp.json \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            --data @- \
            "$SLACK_WEBHOOK_URL") || true

        echo "==> Slack HTTP status: $HTTP_STATUS"

        # Webhook rotacionado, revogado, ou canal arquivado devolve 4xx e a
        # mensagem não chega a ninguém. Deixar isso em [WARN] com o job verde é
        # a forma original do bug desta entrega: classificou certo, ninguém
        # ficou sabendo, check verde. Se "sem canal configurado" derruba o step,
        # "o canal recusou a mensagem" tem que derrubar também.
        if [[ "$HTTP_STATUS" != "200" ]]; then
          echo "::error::Falha ao postar no Slack (status ${HTTP_STATUS:-sem resposta}). O alerta classificado não chegou ao time de dados."
          cat /tmp/slack_resp.json || true
          exit 1
        fi

        TS=$(python3 -c \
          "import sys,json; d=json.load(open('/tmp/slack_resp.json')); print(d.get('ts',''))" \
          2>/dev/null || echo "")
        echo "slack_message_ts=${TS}" >> "$GITHUB_OUTPUT"

    # -------------------------------------------------------------------------
    # 7. Sinaliza nos checks do PR o que precisa de olho humano
    #
    # `unknown` entra junto com `breaking` porque as duas param o merge pelo
    # mesmo motivo: ninguém do time de dados olhou ainda. Sem isto, "não
    # entendi esta operação" só existiria no Slack e não deixaria anotação
    # nenhuma no PR.
    # -------------------------------------------------------------------------
    - name: Gate | Warn on Breaking Change or unknown
      if: contains(fromJSON('["breaking","unknown"]'), steps.set-outputs.outputs.highest_severity)
      shell: bash
      env:
        HIGHEST_SEVERITY: ${{ steps.set-outputs.outputs.highest_severity }}
      run: |
        set -euo pipefail
        if [[ "$HIGHEST_SEVERITY" == "breaking" ]]; then
          echo "::warning::🔴 Breaking Change detectada em migração de banco de dados."
        else
          echo "::warning::🟠 O classificador não entendeu ao menos uma operação desta migração."
        fi
        echo "::warning::Aguarde revisão do time de dados antes do merge."
